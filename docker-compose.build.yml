# Build the three images from this checkout instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  engine:
    image: profitbots-engine:local
    build: .
  web:
    image: profitbots-web:local
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
  backup:
    image: profitbots-backup:local
    build:
      context: deploy
      dockerfile: backup.Dockerfile
