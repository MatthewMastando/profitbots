# profitbots: one Jev-driven trading agent on Coinbase Derivatives, on one small VPS.
# Paper trading unless you deliberately change it.
#
#   cp .env.example .env         set TYPESAFE_API_KEY (and PUBLIC_DOMAIN for HTTPS)
#   docker compose up -d         then open http://<your-server-ip>/ (or https://your-domain)
#   docker compose logs -f engine
#
# The images are built from this repo by GitHub Actions. To build them yourself instead:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: profitbots

services:
  engine:
    image: ghcr.io/matthewmastando/profitbots-engine:latest
    restart: always
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Every setting in .env.example reaches the engine through this file.
    env_file:
      - path: .env
        required: false
    environment:
      # Paper trading by default. Real money needs DRY_RUN=false, MODE=live, Coinbase keys and LIVE_ACK (see README).
      DRY_RUN: ${DRY_RUN:-true}
      MODE: ${MODE:-dry}
      LIVE_ACK: ${LIVE_ACK:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      COINBASE_API_KEY_NAME: ${COINBASE_API_KEY_NAME:-}
      COINBASE_API_PRIVATE_KEY: ${COINBASE_API_PRIVATE_KEY:-}
      COINBASE_PORTFOLIO_ID: ${COINBASE_PORTFOLIO_ID:-}
      TICK_MS: ${TICK_MS:-10000}
      JEV_DAILY_USD_CAP: ${JEV_DAILY_USD_CAP:-2}
      START_EQUITY_USD: ${START_EQUITY_USD:-1000}
      MAX_LEVERAGE: ${MAX_LEVERAGE:-3}
      MAX_TOTAL_NOTIONAL_USD: ${MAX_TOTAL_NOTIONAL_USD:-10000}
      MAX_POSITIONS: ${MAX_POSITIONS:-0}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      UPDATE_CHECK: ${UPDATE_CHECK:-false}
      # Inside the compose network only; the port is never published. Caddy is the only way in.
      ENGINE_BIND: 0.0.0.0
      ENGINE_PORT: "8080"
      DB_PATH: /data/agent-{mode}.sqlite
    volumes:
      - agent-data:/data
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    image: ghcr.io/matthewmastando/profitbots-web:latest
    restart: always
    depends_on: [engine]
    # Non-root Caddy with every capability dropped; the namespaced sysctl lets it bind 80/443.
    user: "1000:1000"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Blank = plain HTTP on the server's IP. Set a domain that points at this server to get automatic HTTPS.
      SITE_ADDRESS: ${PUBLIC_DOMAIN:-:80}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Nightly consistent SQLite backup into the same volume (/data/backups); keeps 14 days.
  backup:
    image: ghcr.io/matthewmastando/profitbots-backup:latest
    restart: always
    depends_on: [engine]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - agent-data:/data

volumes:
  agent-data:
  caddy-data:
  caddy-config:
